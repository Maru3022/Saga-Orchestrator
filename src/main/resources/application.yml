spring:
  application:
    name: saga-orchestrator

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/saga_orchestrator}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: saga-orchestrator-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        linger.ms: 10
        batch.size: 32768

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

server:
  port: 8090
  servlet:
    context-path: /

saga:
  timeout-ms: 120000
  max-retries: 3
  topics:
    user-created: ${SAGA_TOPIC_USER_CREATED:saga.user.created}
    notification-send: ${SAGA_TOPIC_NOTIFICATION_SEND:saga.notification.send}
    notification-response: ${SAGA_TOPIC_NOTIFICATION_RESPONSE:saga.notification.response}
    cabinet-create: ${SAGA_TOPIC_CABINET_CREATE:saga.cabinet.create}
    cabinet-response: ${SAGA_TOPIC_CABINET_RESPONSE:saga.cabinet.response}
    nutrition-calculate: ${SAGA_TOPIC_NUTRITION_CALCULATE:saga.nutrition.calculate}
    nutrition-response: ${SAGA_TOPIC_NUTRITION_RESPONSE:saga.nutrition.response}
    notification-command: ${SAGA_TOPIC_NOTIFICATION_COMMAND:saga-notification-command}
    nutrition-command: ${SAGA_TOPIC_NUTRITION_COMMAND:saga-nutrition-command}
    notification-response-hyphen: ${SAGA_TOPIC_NOTIFICATION_RESPONSE_HYPHEN:saga-notification-response}
    nutrition-response-hyphen: ${SAGA_TOPIC_NUTRITION_RESPONSE_HYPHEN:saga-nutrition-response}
    trains-response: ${SAGA_TOPIC_TRAINS_RESPONSE:saga-trains-response}
    user-response: ${SAGA_TOPIC_USER_RESPONSE:saga-user-response}
    trains-command: ${SAGA_TOPIC_TRAINS_COMMAND:saga-trains-command}
    user-command: ${SAGA_TOPIC_USER_COMMAND:saga-user-command}
    notification-compensate: ${SAGA_TOPIC_NOTIFICATION_COMPENSATE:saga.notification.compensate}
    cabinet-compensate: ${SAGA_TOPIC_CABINET_COMPENSATE:saga.cabinet.compensate}
    user-compensate: ${SAGA_TOPIC_USER_COMPENSATE:saga.user.compensate}
    notification-send-dlt: ${SAGA_TOPIC_NOTIFICATION_SEND_DLT:saga.notification.send.DLT}
    cabinet-create-dlt: ${SAGA_TOPIC_CABINET_CREATE_DLT:saga.cabinet.create.DLT}
    nutrition-calculate-dlt: ${SAGA_TOPIC_NUTRITION_CALCULATE_DLT:saga.nutrition.calculate.DLT}
    user-created-dlt: ${SAGA_TOPIC_USER_CREATED_DLT:saga.user.created.DLT}
    notification-response-dlt: ${SAGA_TOPIC_NOTIFICATION_RESPONSE_DLT:saga.notification.response.DLT}
    cabinet-response-dlt: ${SAGA_TOPIC_CABINET_RESPONSE_DLT:saga.cabinet.response.DLT}
    nutrition-response-dlt: ${SAGA_TOPIC_NUTRITION_RESPONSE_DLT:saga.nutrition.response.DLT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    root: INFO
    org.example: DEBUG
    org.springframework.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} - %logger{36} - %msg%n"
