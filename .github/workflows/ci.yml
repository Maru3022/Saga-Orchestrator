name: CI/CD Saga Orchestrator – Production

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:      # ручной запуск из GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/saga-orchestrator
  JDK_VERSION: '17'
  MAVEN_OPTS: '-Dmaven.repo.local=${{ github.workspace }}/.m2/repository'

jobs:

  # ──────────────────────────────────────────────────────────
  # 1. Checkout, compile, test, analyse – всё в одном job
  # ──────────────────────────────────────────────────────────
  build-and-analyse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # для GitHub Code Scanning
      checks: write

    services:
      # даже если тесты используют моки, иногда полезно иметь реальный Redis
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK ${{ env.JDK_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: 'temurin'

      # ========== КОМПИЛЯЦИЯ ==========
      - name: Compile with Maven
        run: mvn compile -B -q

      # ========== СТАТИЧЕСКИЙ АНАЛИЗ ==========
      - name: Checkstyle (Google style)
        run: |
          mvn checkstyle:check -B \
            -Dcheckstyle.config.location=google_checks.xml \
            -Dcheckstyle.violationSeverity=warning
        continue-on-error: true   # не блокирует, но отчёт будет виден

      - name: SpotBugs (FindBugs successor)
        run: mvn spotbugs:check -B
        continue-on-error: true

      - name: PMD source code analyser
        run: mvn pmd:check -B
        continue-on-error: true

      # ========== ЮНИТ-ТЕСТЫ + ПОКРЫТИЕ ==========
      - name: Unit tests with JaCoCo coverage
        run: mvn test jacoco:report -B
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Verify test coverage threshold (80%)
        run: |
          mvn jacoco:check -B \
            -Djacoco.line.coverage=0.80 \
            -Djacoco.branch.coverage=0.75
        continue-on-error: true

      # ========== ИНТЕГРАЦИОННЫЕ ТЕСТЫ (если есть) ==========
      - name: Integration tests (if any)
        run: mvn verify -P integration-test -B -Dskip.unit.tests=false
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_REDIS_HOST: localhost
        continue-on-error: true

      # ========== АНАЛИЗ ЗАВИСИМОСТЕЙ НА УЯЗВИМОСТИ ==========
      - name: OWASP Dependency-Check
        run: mvn dependency-check:check -B -DfailBuildOnCVSS=7
        continue-on-error: true

      # ========== SONARQUBE / SONARCLOUD (опционально) ==========
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository }}
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      # ========== СБОРКА DOCKER-ОБРАЗА ==========
      - name: Build Docker image (no push)
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy SARIF results to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      # ========== ПУБЛИКАЦИЯ ОБРАЗА (только main) ==========
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} \
                     ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # ========== УВЕДОМЛЕНИЕ О ПАДЕНИИ ==========
      - name: Notify Slack on failure
        if: failure() && github.ref == 'refs/heads/main'
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "❌ CI failed for saga-orchestrator\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}\nLink: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}