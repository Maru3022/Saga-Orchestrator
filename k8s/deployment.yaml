apiVersion: v1
kind: Namespace
metadata:
  name: saga-orchestrator

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: saga-orchestrator-config
  namespace: saga-orchestrator
data:
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-broker-0.kafka-headless.kafka.svc.cluster.local:9092,kafka-broker-1.kafka-headless.kafka.svc.cluster.local:9092,kafka-broker-2.kafka-headless.kafka.svc.cluster.local:9092"
  EUREKA_URI: "http://eureka-server.eureka.svc.cluster.local:8761/eureka"
  REDIS_HOST: "redis-master.redis.svc.cluster.local"
  REDIS_PORT: "6379"
  POSTGRES_URL: "jdbc:postgresql://postgres-service.postgres.svc.cluster.local:5432/saga_orchestrator"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"

---
apiVersion: v1
kind: Secret
metadata:
  name: saga-orchestrator-secrets
  namespace: saga-orchestrator
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgresql-secure-password-change-me"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saga-orchestrator
  namespace: saga-orchestrator
  labels:
    app: saga-orchestrator
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: saga-orchestrator
  template:
    metadata:
      labels:
        app: saga-orchestrator
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: saga-orchestrator
      containers:
      - name: saga-orchestrator
        image: saga-orchestrator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8090
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled"
        envFrom:
        - configMapRef:
            name: saga-orchestrator-config
        - secretRef:
            name: saga-orchestrator-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - sleep 15
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: config-volume
        configMap:
          name: saga-orchestrator-config
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - saga-orchestrator
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: saga-orchestrator
  namespace: saga-orchestrator
  labels:
    app: saga-orchestrator
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  selector:
    app: saga-orchestrator

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: saga-orchestrator
  namespace: saga-orchestrator

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: saga-orchestrator-pdb
  namespace: saga-orchestrator
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: saga-orchestrator

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: saga-orchestrator-hpa
  namespace: saga-orchestrator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: saga-orchestrator
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: saga-orchestrator
  namespace: saga-orchestrator
  labels:
    app: saga-orchestrator
spec:
  selector:
    matchLabels:
      app: saga-orchestrator
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 30s
    scrapeTimeout: 10s
